<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解密還原工具 (E2EE 轉明文)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-6 flex justify-center items-start min-h-screen">
  <div class="max-w-2xl w-full bg-white rounded-2xl shadow-lg p-8">
    <div class="flex items-center justify-between mb-6 border-b pb-4">
      <h1 class="text-2xl font-extrabold text-gray-800">🔓 資料庫解密還原工具</h1>
      <span id="conn-status" class="px-3 py-1 rounded bg-gray-200 text-gray-600 text-sm font-bold">檢查連線中...</span>
    </div>

    <div class="mb-8 p-5 bg-amber-50 border border-amber-200 rounded-xl">
      <h2 class="text-lg font-bold text-amber-900 mb-1">使用說明</h2>
      <p class="text-sm text-amber-700 mb-4">輸入你原本的短密碼，系統會登入 Firebase 並將雲端加密的更表資料全部解密為「明文 JSON」儲存回 Firebase。完成後可直接刪除此網頁。</p>
      
      <div class="mb-4">
        <label class="block text-sm font-bold text-gray-700 mb-1">主密碼 (Master Password)</label>
        <input type="password" id="pwd" inputmode="decimal" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-amber-500 outline-none font-mono" placeholder="輸入解鎖密碼">
      </div>
      <button id="btn-run" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg transition-colors flex justify-center items-center gap-2 shadow-md">
        開始解密並寫回明文
      </button>
    </div>

    <div>
      <h3 class="text-sm font-bold text-gray-500 mb-2">執行紀錄</h3>
      <div id="log-console" class="bg-gray-900 text-green-400 font-mono text-sm p-4 rounded-lg h-56 overflow-y-auto whitespace-pre-wrap">等待操作...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

    if (!window.APP_CONFIG) throw new Error("Missing config.js");
    const CONFIG = window.APP_CONFIG;
    let db, auth;
    const ui = { status: document.getElementById('conn-status'), log: document.getElementById('log-console'), btn: document.getElementById('btn-run'), pwd: document.getElementById('pwd') };

    function log(msg, type = 'info') {
      const time = new Date().toLocaleTimeString();
      let color = 'text-green-400';
      if (type === 'error') color = 'text-red-400 font-bold';
      if (type === 'warn') color = 'text-yellow-400';
      ui.log.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`; ui.log.scrollTop = ui.log.scrollHeight;
    }

    try {
      const app = initializeApp(CONFIG.firebaseBase);
      db = getDatabase(app, CONFIG.firebaseBase.databaseURL);
      auth = getAuth(app);
      ui.status.innerText = "🟢 已連線"; ui.status.className = "px-3 py-1 rounded bg-green-100 text-green-700 text-sm font-bold";
    } catch (err) { log("連線失敗: " + err.message, "error"); }

    const CryptoHelper = {
      b642buf: (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer,
      deriveKey: async (password, saltUint8Array) => {
        const enc = new TextEncoder();
        const keyMat = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits", "deriveKey"]);
        return await crypto.subtle.deriveKey({ name: "PBKDF2", salt: saltUint8Array, iterations: 100000, hash: "SHA-256" }, keyMat, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      },
      decryptData: async (cipherB64, ivB64, cryptoKey) => {
        const iv = CryptoHelper.b642buf(ivB64), cipher = CryptoHelper.b642buf(cipherB64);
        const decBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, cryptoKey, cipher);
        return JSON.parse(new TextDecoder().decode(decBuffer));
      }
    };

    ui.btn.addEventListener('click', async () => {
      const pwd = ui.pwd.value;
      if (!pwd) return log("❌ 請輸入密碼！", "error");

      try {
        ui.btn.disabled = true;
        log("🔑 正在進行 Firebase Auth 身分認證 (使用 _Auth 自動後綴)...");
        await signInWithEmailAndPassword(auth, "roster@internal.local", pwd + "roster");
        log("✅ Auth 登入成功！");

        log("⏳ 正在獲取雲端資料庫...");
        const snap = await get(ref(db, CONFIG.dbPath));
        if (!snap.exists()) return log("⚠️ 資料庫為空，無須解密。");

        const data = snap.val();
        let plainDays = {};

        // 判斷 1：已是明文結構
        if (data.days && !data.global_salt) {
          const sampleKey = Object.keys(data.days)[0];
          if (sampleKey && data.days[sampleKey].shifts && !data.days[sampleKey].ciphertext) {
            return log("✅ 資料庫目前已經是乾淨的明文格式，無須解密！", "warn");
          }
        }

        // 判斷 2：V10/V11 按日碎片化加密結構
        if (data.global_salt && data.days) {
          log("🔒 偵測到 V10/V11 按日加密格式，開始逐日解密...");
          const saltBuf = CryptoHelper.b642buf(data.global_salt);
          const key = await CryptoHelper.deriveKey(pwd, saltBuf);

          for (const [dStr, dayObj] of Object.entries(data.days)) {
            if (dayObj.ciphertext && dayObj.iv) {
              plainDays[dStr] = await CryptoHelper.decryptData(dayObj.ciphertext, dayObj.iv, key);
            } else {
              plainDays[dStr] = dayObj;
            }
          }
          log(`✅ 成功解密 ${Object.keys(plainDays).length} 天的更表！`);
        } 
        // 判斷 3：V9 全打包加密結構
        else if (data.ciphertext && data.salt && data.iv) {
          log("🔒 偵測到 V9 全打包加密格式，解密中...");
          const saltBuf = CryptoHelper.b642buf(data.salt);
          const key = await CryptoHelper.deriveKey(pwd, saltBuf);
          plainDays = await CryptoHelper.decryptData(data.ciphertext, data.iv, key);
          log(`✅ 成功解密全打包更表！`);
        } else {
          plainDays = data.days || data;
          log("⚠️ 未偵測到標準加密欄位，將保留原始結構。");
        }

        log("🚀 正在將解密後的明文寫回 Firebase...");
        // 寫入純明文結構，移除 global_salt
        await set(ref(db, CONFIG.dbPath), { days: plainDays });
        log("🎉 大功告成！Firebase 資料庫已成功還原為明文格式，你可以開始使用新的 index.html 了！", "info");

      } catch (err) {
        log("🚨 執行失敗: " + err.message, "error");
      } finally {
        ui.btn.disabled = false;
      }
    });
  </script>
</body>
</html>
