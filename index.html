<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <title>排更助手 v2</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>

  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    html, body {
      height: 100%; margin: 0; overflow: hidden;
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: pan-y;
    }
    #app {
      display: flex; flex-direction: column; height: 100dvh;
      padding-bottom: var(--safe-bottom);
    }
    #weeks-container {
      flex: 1; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; scrollbar-width: none;
    }
    #weeks-container.instant-scroll { scroll-behavior: auto; }
    #weeks-container::-webkit-scrollbar { display: none; }
    .week-page {
      height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
      display: flex; flex-direction: column; padding: 0.5rem; box-sizing: border-box;
    }
    .shift-divider { width: 1px; background-color: #e5e7eb; margin: 0 4px; }
    .slot-empty { border: 1.5px dashed #cbd5e1; background-color: #f8fafc; }
    .sat-unlock-btn { border: 1px dashed #9ca3af; background-color: #f3f4f6; color: #6b7280; }
    .modal-enter { animation: fade-in 0.2s ease-out forwards; }
    .tab-active { border-bottom: 2px solid #2563eb; color: #1d4ed8; font-weight: bold; }
    .tab-inactive { color: #6b7280; font-weight: 500; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <header class="bg-white shadow-sm z-20 shrink-0 pt-[var(--safe-top)]">
    <!-- Row 1 -->
    <div class="h-11 flex justify-between items-center px-3 border-b border-gray-100">
      <div class="flex-1 flex justify-start">
        <span id="conn-status" class="bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded border border-gray-200 text-[10px] font-bold tracking-wider">📶 準備連線</span>
      </div>
      <h1 class="font-extrabold text-[17px] text-gray-900 tracking-widest text-center flex-1">編更表</h1>
      <div class="flex-1 flex justify-end gap-4">
        <button id="btn-stats" class="text-xl active:scale-75 transition-transform opacity-80">📊</button>
        <button id="btn-settings" class="text-xl active:scale-75 transition-transform opacity-80">⚙️</button>
      </div>
    </div>
    <!-- Row 2 -->
    <div class="h-12 flex justify-between items-center px-2 bg-gray-50/50">
      <button id="prev-week" class="text-blue-600 font-bold px-3 py-2 active:scale-95 transition-transform text-sm">&lt; 上一週</button>
      <button id="btn-open-calendar" class="font-bold text-[15px] text-gray-800 bg-white border border-gray-200 px-4 py-1.5 rounded-lg active:bg-gray-100 shadow-sm transition-colors tracking-wide flex items-center gap-1">
        🗓️ <span id="header-date-range">載入中...</span>
      </button>
      <button id="next-week" class="text-blue-600 font-bold px-3 py-2 active:scale-95 transition-transform text-sm">下一週 &gt;</button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="weeks-container" class="instant-scroll"></main>

  <!-- Footer Input Area -->
  <footer id="keyboard-container" class="relative shrink-0 bg-white border-t border-gray-200 pb-1 pt-1 h-[140px]">
    
    <!-- Glass Overlay (Locked / Waiting) -->
    <div id="lock-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-[2px] z-10 flex-col justify-center items-center cursor-pointer active:bg-white/60 transition-colors flex">
      <div id="lock-msg-box" class="bg-gray-800 text-white px-5 py-2.5 rounded-full font-bold shadow-lg flex items-center gap-2 mb-1">
        <span id="lock-icon" class="text-lg">🔒</span> <span id="lock-text">本週已排滿鎖定</span>
      </div>
      <p id="lock-subtext" class="text-[11px] text-gray-600 font-bold tracking-widest bg-white/90 px-2 py-0.5 rounded shadow-sm">點擊此處解鎖修改</p>
    </div>

    <!-- Keyboard -->
    <div id="keyboard-area" class="p-2 pt-1 h-full flex flex-col justify-between">
      <div id="staff-keys" class="grid grid-cols-3 gap-2"></div>
      
      <!-- Bottom Action Row (1/3 split) -->
      <div class="flex justify-between gap-2 h-14 mt-2">
        <!-- Active Date & Clear -->
        <div class="flex-1 flex flex-row items-center justify-between bg-gray-50 border border-gray-200 rounded-xl px-2 shadow-sm">
          <div id="active-date-display" class="flex flex-col items-center justify-center w-full">
            <!-- Dynamically populated -->
          </div>
        </div>
        
        <!-- All Off -->
        <button id="btn-alloff" class="flex-1 bg-orange-50 text-orange-600 border border-orange-200 font-bold rounded-xl shadow-sm active:bg-orange-100 text-[17px] flex items-center justify-center gap-1">
          <span>🌴</span>全休
        </button>
        
        <!-- Backspace -->
        <button id="btn-backspace" class="flex-1 bg-gray-100 text-gray-700 border border-gray-300 font-bold rounded-xl shadow-sm active:bg-gray-200 text-[17px] flex items-center justify-center gap-1">
          <span>⌫</span>退格
        </button>
      </div>
    </div>
  </footer>
</div>

<!-- Modal: Settings -->
<div id="modal-settings" class="fixed inset-0 bg-gray-900/60 z-50 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-sm">
  <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col">
    <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
      <h2 class="text-lg font-bold text-gray-800">⚙️ 系統設定</h2>
      <button id="close-settings" class="text-gray-400 hover:text-gray-600 text-3xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-5">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Firebase API Key</label>
        <input type="password" id="input-api-key" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm font-mono" placeholder="AIzaSy...">
      </div>
      <button id="btn-save-settings" class="w-full bg-gray-800 text-white font-bold py-3 rounded-xl shadow-md active:bg-gray-900 transition-colors">儲存並重新載入</button>
    </div>
  </div>
</div>

<!-- Modal: Stats (3 Tabs) -->
<div id="modal-stats" class="fixed inset-0 bg-gray-900/60 z-50 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-sm">
  <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
    <div class="px-5 py-3 border-b border-gray-100 flex justify-between items-center bg-blue-50">
      <h2 class="text-lg font-bold text-blue-900">📊 系統統計與 AI</h2>
      <button id="close-stats" class="text-blue-400 hover:text-blue-600 text-3xl leading-none">&times;</button>
    </div>
    
    <!-- Tabs Header -->
    <div class="flex border-b border-gray-200 bg-white">
      <button class="flex-1 py-2.5 text-[13px] tab-active" onclick="StatsEngine.switchTab(1)" id="tab-btn-1">均位對比</button>
      <button class="flex-1 py-2.5 text-[13px] tab-inactive" onclick="StatsEngine.switchTab(2)" id="tab-btn-2">累積盈虧</button>
      <button class="flex-1 py-2.5 text-[13px] tab-inactive" onclick="StatsEngine.switchTab(3)" id="tab-btn-3">命中率</button>
    </div>

    <div class="p-4 overflow-y-auto flex-1 flex flex-col bg-gray-50/50">
      <!-- Tab 1: Baseline -->
      <div id="tab-content-1" class="block space-y-3">
        <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm">
          <div id="stats-baseline" class="text-center font-extrabold text-lg text-blue-600 mb-2 pb-2 border-b border-gray-100">動態基準均位: --</div>
          <div class="text-[10px] text-gray-400 text-center mb-2">數值越細代表佔據越多靚位；放假者不計分順延</div>
          <div id="stats-grid-1" class="grid grid-cols-2 gap-2"></div>
        </div>
      </div>

      <!-- Tab 2: PnL -->
      <div id="tab-content-2" class="hidden space-y-3">
        <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm">
          <div class="text-center font-extrabold text-[15px] text-gray-800 mb-1">累積盈虧分數</div>
          <div class="text-[10px] text-gray-400 text-center mb-3 pb-2 border-b border-gray-100">綠色正數為「賺咗/著數」，紅色負數為「蝕咗/硬食」</div>
          <div id="stats-grid-2" class="grid grid-cols-3 gap-2"></div>
        </div>
      </div>

      <!-- Tab 3: Hit Rate -->
      <div id="tab-content-3" class="hidden space-y-3">
        <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm">
          <div class="text-center font-extrabold text-[15px] text-gray-800 mb-1">更位命中率</div>
          <div class="text-[10px] text-gray-400 text-center mb-3 pb-2 border-b border-gray-100">靚: 1-2更 | 平: 3-4更 | 差: 5-6更</div>
          <div id="stats-grid-3" class="flex flex-col gap-2"></div>
        </div>
      </div>

      <div class="mt-4 shrink-0">
        <button id="btn-copy-prompt" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-2 text-[16px]">📋 複製 AI Prompt</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Calendar -->
<div id="modal-calendar" class="fixed inset-0 bg-gray-900/60 z-50 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-sm">
  <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col p-5 pb-8">
    <div class="flex justify-between items-center mb-6 px-2">
      <button id="cal-prev" class="w-10 h-10 rounded-full bg-gray-50 text-gray-600 font-bold flex items-center justify-center text-lg active:bg-gray-200">&lt;</button>
      <h2 id="cal-month-title" class="text-xl font-extrabold text-gray-800 tracking-wider">YYYY年 MM月</h2>
      <button id="cal-next" class="w-10 h-10 rounded-full bg-gray-50 text-gray-600 font-bold flex items-center justify-center text-lg active:bg-gray-200">&gt;</button>
    </div>
    <div class="grid grid-cols-7 text-center mb-2">
      <div class="text-xs font-bold text-red-500">日</div><div class="text-xs font-bold text-gray-500">一</div><div class="text-xs font-bold text-gray-500">二</div>
      <div class="text-xs font-bold text-gray-500">三</div><div class="text-xs font-bold text-gray-500">四</div><div class="text-xs font-bold text-gray-500">五</div><div class="text-xs font-bold text-gray-500">六</div>
    </div>
    <div id="cal-grid" class="grid grid-cols-7 gap-y-3 gap-x-1 text-center mb-6"></div>
    
    <div class="flex justify-center gap-4 text-[10px] font-bold text-gray-500 mb-6">
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span>已填</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-400"></span>未填</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full border border-red-300 bg-red-50"></span>休假/紅日</span>
    </div>
    <button id="close-calendar" class="w-full bg-gray-100 text-gray-700 font-bold py-3.5 rounded-xl active:bg-gray-200 transition-colors">關閉</button>
  </div>
</div>

<script type="module">
  // 嚴格攔截：確保 Config 存在
  if (!window.APP_CONFIG || !window.APP_CONFIG.DEFAULT_PROMPT) {
    document.body.innerHTML = '<div style="color:red;padding:20px;text-align:center;font-weight:bold;font-size:20px;margin-top:50px;">致命錯誤：無法讀取 config.js，請檢查設定檔。</div>';
    throw new Error("Missing config.js");
  }

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

  const CONFIG = window.APP_CONFIG;

  const Utils = {
    formatDate: (d) => {
      const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    },
    getSunday: (dateStr) => {
      const d = new Date(dateStr); d.setDate(d.getDate() - d.getDay()); return Utils.formatDate(d);
    },
    addDays: (dateStr, days) => {
      const d = new Date(dateStr); d.setDate(d.getDate() + days); return Utils.formatDate(d);
    },
    normalizeShifts: (rawShifts) => {
      if (!rawShifts) return [];
      if (Array.isArray(rawShifts)) return rawShifts.filter(Boolean);
      return Object.values(rawShifts).filter(Boolean);
    }
  };

  const STATE = {
    todayStr: Utils.formatDate(new Date()), 
    daysMap: {},            
    renderedWeeks: new Set(), 
    focusedWeekStart: null,
    
    // 狀態機：LOCKED (全封印) | WAITING (解鎖待選) | ACTIVE (正常輸入)
    inputMode: 'LOCKED', 
    activeDate: null, // 當前選中的日期
    
    apiKey: localStorage.getItem('roster_api_key') || '',
    db: null,
    calRenderMonth: new Date() 
  };

  const UI = {
    container: document.getElementById('weeks-container'),
    headerDate: document.getElementById('header-date-range'),
    lockOverlay: document.getElementById('lock-overlay'),
    lockMsgBox: document.getElementById('lock-msg-box'),
    lockIcon: document.getElementById('lock-icon'),
    lockText: document.getElementById('lock-text'),
    lockSubtext: document.getElementById('lock-subtext'),
    activeDateDisplay: document.getElementById('active-date-display'),

    generateDayHTML: (dateStr, dayIndex) => {
      if (dayIndex === 0) return ''; // 徹底隱藏星期日

      const dObj = new Date(dateStr);
      const dayName = CONFIG.WEEK_DAYS[dayIndex];
      const mdStr = `${dObj.getMonth()+1}/${dObj.getDate()}`;
      
      const dayData = STATE.daysMap[dateStr] || { isFullDayHoliday: false, shifts: [] };
      const shifts = Utils.normalizeShifts(dayData.shifts);
      
      const isActive = STATE.inputMode === 'ACTIVE' && STATE.activeDate === dateStr;
      const highlightClass = isActive ? 'ring-2 ring-blue-500 ring-offset-1 z-10' : 'border border-gray-200/75';
      const todayTag = (dateStr === STATE.todayStr) ? `<div class="absolute -left-1 -top-1 bg-purple-600 text-white text-[9px] font-bold px-1 rounded-sm shadow-sm z-20">今日</div>` : '';

      const labelBlock = `
        <div class="w-12 flex flex-col items-center justify-center border-r border-gray-200/60 mr-1 pr-1 shrink-0 relative">
           ${todayTag}
           <div class="font-extrabold text-gray-700 text-lg leading-tight">${dayName}</div>
           <div class="text-[10px] text-gray-400 font-bold">${mdStr}</div>
        </div>
      `;

      // 星期六按鈕
      if (dayIndex === 6 && shifts.length === 0 && !dayData.isFullDayHoliday && !dayData.unlocked) {
        return `<div class="flex items-center h-[42px] shrink-0 mt-1 cursor-pointer" data-date="${dateStr}" onclick="Engine.handleRowClick('${dateStr}')">
                  ${labelBlock}
                  <div class="flex-1 h-full px-1">
                     <div class="w-full h-full rounded-lg sat-unlock-btn text-sm font-bold flex items-center justify-center gap-1">
                       <span>🔒</span> 點擊解鎖排班
                     </div>
                  </div>
                </div>`;
      }
      
      // 全休
      if (dayData.isFullDayHoliday) {
        return `<div class="flex items-center h-full min-h-[46px] bg-red-50 rounded-lg p-1 relative border border-red-100 ${isActive ? 'ring-2 ring-blue-500' : ''}" data-date="${dateStr}" onclick="Engine.handleRowClick('${dateStr}')">
                  ${labelBlock}
                  <div class="flex-1 flex justify-center text-red-500 font-bold tracking-widest text-sm pointer-events-none">🌴 全休日</div>
                </div>`;
      }

      // 控制人名是否可點擊 (LOCKED 時徹底封印 pointer-events)
      const slotsPointerClass = (STATE.inputMode === 'LOCKED') ? 'pointer-events-none' : '';

      let slotsHTML = '';
      for (let i = 0; i < 6; i++) {
        if (i === 2 || i === 4) slotsHTML += `<div class="shift-divider h-3/4"></div>`;
        const shift = shifts[i];
        if (shift) {
          const isLeave = shift.status === 'LEAVE';
          const bgClass = isLeave ? 'bg-red-50 border-red-300 text-red-600 font-extrabold' : 'bg-eff6ff border-[#3b82f6] text-[#1e3a8a] font-bold';
          slotsHTML += `<div onclick="Engine.toggleLeave(event, '${dateStr}', ${i})" class="flex-1 h-full rounded border-[1.5px] ${bgClass} flex items-center justify-center text-lg cursor-pointer active:scale-90 transition-transform">${shift.staff}</div>`;
        } else {
          slotsHTML += `<div class="flex-1 h-full rounded slot-empty flex items-center justify-center text-lg"></div>`;
        }
      }

      return `<div class="flex items-center h-full min-h-[46px] bg-white rounded-lg p-1 relative shadow-sm transition-shadow cursor-pointer ${highlightClass}" data-date="${dateStr}" onclick="Engine.handleRowClick('${dateStr}')">
                ${labelBlock}
                <div class="flex-1 flex h-full gap-1 items-center px-1 ${slotsPointerClass}">${slotsHTML}</div>
              </div>`;
    },

    renderWeekPage: (sundayStr) => {
      if (STATE.renderedWeeks.has(sundayStr)) return;
      STATE.renderedWeeks.add(sundayStr);

      const weekDiv = document.createElement('div');
      weekDiv.className = 'week-page'; weekDiv.dataset.weekStart = sundayStr;
      
      let html = `<div class="bg-gray-50/50 rounded-xl h-full flex flex-col p-1 box-border">
                    <div class="flex text-center text-xs font-bold text-gray-500 mb-1 pb-1 border-b border-gray-200 shrink-0">
                      <div class="w-12 flex items-center justify-center">日期</div>
                      <div class="flex-1 flex justify-between px-1">
                        <div class="flex-1">1更</div><div class="flex-1">2更</div><div class="shift-divider bg-transparent"></div>
                        <div class="flex-1">3更</div><div class="flex-1">4更</div><div class="shift-divider bg-transparent"></div>
                        <div class="flex-1">5更</div><div class="flex-1">6更</div>
                      </div>
                    </div>
                    <div class="flex flex-col flex-1 justify-around gap-1.5 pb-1">`;
      for (let i = 1; i <= 6; i++) html += UI.generateDayHTML(Utils.addDays(sundayStr, i), i);
      html += `</div></div>`;
      weekDiv.innerHTML = html;
      
      const existing = Array.from(UI.container.children);
      const insertBefore = existing.find(node => node.dataset.weekStart > sundayStr);
      if (insertBefore) UI.container.insertBefore(weekDiv, insertBefore);
      else UI.container.appendChild(weekDiv);
    },

    refreshAllVisible: () => {
      document.querySelectorAll('[data-date]').forEach(el => {
        const dStr = el.dataset.date;
        el.outerHTML = UI.generateDayHTML(dStr, new Date(dStr).getDay());
      });
      UI.updateFooter();
    },

    silentRefreshDay: (dateStr) => {
      const dayEl = document.querySelector(`div[data-date="${dateStr}"]`);
      if (dayEl) dayEl.outerHTML = UI.generateDayHTML(dateStr, new Date(dateStr).getDay());
    },

    updateFooter: () => {
      if (STATE.inputMode === 'LOCKED') {
        UI.lockOverlay.classList.remove('hidden');
        UI.lockMsgBox.className = "bg-gray-800 text-white px-5 py-2.5 rounded-full font-bold shadow-lg flex items-center gap-2 mb-1";
        UI.lockIcon.innerText = "🔒";
        UI.lockText.innerText = "本週已排滿鎖定";
        UI.lockSubtext.innerText = "點擊此處解鎖修改";
        UI.lockSubtext.classList.remove('hidden');
        UI.activeDateDisplay.innerHTML = ""; // 徹底留白
      } else if (STATE.inputMode === 'WAITING') {
        UI.lockOverlay.classList.remove('hidden');
        UI.lockMsgBox.className = "bg-blue-100 border border-blue-300 text-blue-800 px-5 py-2.5 rounded-full font-bold shadow-lg flex items-center gap-2 mb-1";
        UI.lockIcon.innerText = "👆";
        UI.lockText.innerText = "請點擊上方更表，選擇修改日子";
        UI.lockSubtext.classList.add('hidden');
        UI.activeDateDisplay.innerHTML = ""; // 徹底留白
      } else if (STATE.inputMode === 'ACTIVE') {
        UI.lockOverlay.classList.add('hidden');
        const dObj = new Date(STATE.activeDate);
        UI.activeDateDisplay.innerHTML = `
          <div class="flex w-full justify-between items-center h-full px-1">
            <div class="flex flex-col items-center leading-tight">
              <span class="text-sm font-extrabold text-blue-700">${CONFIG.WEEK_DAYS[dObj.getDay()]}</span>
              <span class="text-[10px] text-gray-500 font-bold">${dObj.getMonth()+1}/${dObj.getDate()}</span>
            </div>
            <button id="btn-clear-active" class="h-8 w-8 bg-white border border-gray-200 rounded-lg shadow-sm text-red-500 flex justify-center items-center active:bg-gray-100">
               <span class="text-sm">🧹</span>
            </button>
          </div>
        `;
        document.getElementById('btn-clear-active').onclick = () => Engine.clearDay(STATE.activeDate);
      }
    },

    scrollToWeek: (sundayStr) => {
      const weekEl = document.querySelector(`div[data-week-start="${sundayStr}"]`);
      if (weekEl) weekEl.scrollIntoView({ block: 'center' });
      // Remove instant class after first scroll
      setTimeout(() => UI.container.classList.remove('instant-scroll'), 100);
    }
  };

  const Engine = {
    evaluateLockState: () => {
      if (!STATE.focusedWeekStart) return;
      let isFull = true;
      for (let i = 1; i <= 5; i++) {
        const dStr = Utils.addDays(STATE.focusedWeekStart, i);
        const dayData = STATE.daysMap[dStr] || {};
        const shifts = Utils.normalizeShifts(dayData.shifts);
        if (!dayData.isFullDayHoliday && shifts.length < 6) { isFull = false; break; }
      }

      if (isFull) {
        STATE.inputMode = 'LOCKED';
        STATE.activeDate = null;
      } else {
        STATE.inputMode = 'ACTIVE';
        Engine.autoSetNextActive();
      }
      UI.refreshAllVisible();
    },

    autoSetNextActive: () => {
      for (let i = 1; i <= 6; i++) {
        const dStr = Utils.addDays(STATE.focusedWeekStart, i);
        const dayData = STATE.daysMap[dStr] || {};
        if (dayData.isFullDayHoliday) continue;
        const shifts = Utils.normalizeShifts(dayData.shifts);
        if (i === 6 && !dayData.unlocked && shifts.length === 0) continue;
        if (shifts.length < 6) {
          STATE.activeDate = dStr;
          return;
        }
      }
      STATE.activeDate = null;
      STATE.inputMode = 'WAITING'; // Shouldn't hit this often if not full, but safe fallback
    },

    handleOverlayClick: () => {
      if (STATE.inputMode === 'LOCKED') {
        STATE.inputMode = 'WAITING';
        UI.refreshAllVisible();
      }
    },

    handleRowClick: (dateStr) => {
      // 點擊行時，設定為 Active (無視當前 Mode)
      if (STATE.inputMode === 'LOCKED') return; // LOCKED 狀態完全封鎖點擊
      
      const dayData = STATE.daysMap[dateStr] || {};
      const dayIndex = new Date(dateStr).getDay();

      if (dayIndex === 6 && !dayData.unlocked) {
        if (!STATE.daysMap[dateStr]) STATE.daysMap[dateStr] = {};
        STATE.daysMap[dateStr].unlocked = true;
      }
      
      STATE.inputMode = 'ACTIVE';
      STATE.activeDate = dateStr;
      UI.refreshAllVisible();
    },

    toggleLeave: (e, dateStr, index) => {
      e.stopPropagation(); // 防止觸發行點擊 (Active 設定)
      if (STATE.inputMode === 'LOCKED') return;
      
      const dayData = STATE.daysMap[dateStr];
      if(dayData && dayData.shifts && dayData.shifts[index]) {
        dayData.shifts[index].status = dayData.shifts[index].status === 'LEAVE' ? 'ON' : 'LEAVE';
        UI.silentRefreshDay(dateStr); 
        FirebaseSync.pushUpdate(dateStr);
      }
    },

    addShift: (staffCode) => {
      if (STATE.inputMode !== 'ACTIVE' || !STATE.activeDate) return;
      
      const targetDate = STATE.activeDate;
      if (!STATE.daysMap[targetDate]) STATE.daysMap[targetDate] = { shifts: [] };
      STATE.daysMap[targetDate].shifts = Utils.normalizeShifts(STATE.daysMap[targetDate].shifts);
      
      if (STATE.daysMap[targetDate].shifts.length < 6) {
        STATE.daysMap[targetDate].shifts.push({ staff: staffCode, status: 'ON' });
        FirebaseSync.pushUpdate(targetDate);
        
        if (STATE.daysMap[targetDate].shifts.length === 6) {
          Engine.evaluateLockState(); // 自動檢查係咪滿咗，滿咗會自動 Locked/跳日
          if (STATE.inputMode === 'LOCKED' && new Date(targetDate).getDay() === 5) {
            const nextSun = Utils.addDays(STATE.focusedWeekStart, 7);
            UI.renderWeekPage(nextSun); 
            setTimeout(() => UI.scrollToWeek(nextSun), 300);
          }
        } else {
          UI.refreshAllVisible();
        }
      }
    },

    backspace: () => {
      if (STATE.inputMode !== 'ACTIVE' || !STATE.activeDate) return;
      const targetDate = STATE.activeDate;
      const dayData = STATE.daysMap[targetDate];
      if (!dayData) return;
      
      dayData.shifts = Utils.normalizeShifts(dayData.shifts);
      if (dayData.shifts.length > 0) {
        dayData.shifts.pop(); 
        FirebaseSync.pushUpdate(targetDate);
        Engine.evaluateLockState();
      }
    },

    setAllOff: () => {
      if (STATE.inputMode !== 'ACTIVE' || !STATE.activeDate) return;
      const targetDate = STATE.activeDate;
      STATE.daysMap[targetDate] = { isFullDayHoliday: true, shifts: [] };
      FirebaseSync.pushUpdate(targetDate); 
      Engine.evaluateLockState();
    },

    clearDay: (targetDate) => {
      if (!targetDate) return;
      const dayData = STATE.daysMap[targetDate] || {};
      STATE.daysMap[targetDate] = { isFullDayHoliday: false, shifts: [], unlocked: dayData.unlocked };
      FirebaseSync.pushUpdate(targetDate); 
      Engine.evaluateLockState();
    }
  };

  const CalendarManager = {
    modal: document.getElementById('modal-calendar'),
    grid: document.getElementById('cal-grid'),
    title: document.getElementById('cal-month-title'),
    
    render: () => {
      const year = STATE.calRenderMonth.getFullYear();
      const month = STATE.calRenderMonth.getMonth();
      CalendarManager.title.innerText = `${year}年 ${month + 1}月`;
      CalendarManager.grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay(); 
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) CalendarManager.grid.innerHTML += `<div></div>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = Utils.formatDate(new Date(year, month, day));
        const dayOfWeek = new Date(year, month, day).getDay();
        const dayData = STATE.daysMap[dStr] || { isFullDayHoliday: false, shifts: [] };
        const shifts = Utils.normalizeShifts(dayData.shifts);

        let cellClass = "h-10 rounded-xl flex flex-col items-center justify-center text-sm font-bold active:scale-90 transition-transform cursor-pointer ";
        let isRed = (dayOfWeek === 0 || dayData.isFullDayHoliday);
        
        if (isRed) cellClass += "text-red-500 bg-red-50 border border-red-100 ";
        else cellClass += "text-gray-700 bg-white border border-gray-100 shadow-sm ";

        let dotHTML = `<div class="h-1.5 mt-0.5"></div>`; 
        if (!isRed && dayOfWeek >= 1 && dayOfWeek <= 5 && dStr >= CONFIG.SYSTEM_START_DATE) {
          if (shifts.length === 6) dotHTML = `<div class="h-1.5 w-1.5 rounded-full bg-green-500 mt-0.5"></div>`;
          else dotHTML = `<div class="h-1.5 w-1.5 rounded-full bg-yellow-400 mt-0.5"></div>`;
        }

        CalendarManager.grid.innerHTML += `
          <div class="${cellClass}" onclick="CalendarManager.jumpTo('${dStr}')">
            <span>${day}</span>
            ${dotHTML}
          </div>
        `;
      }
    },
    jumpTo: (dateStr) => {
      const sundayStr = Utils.getSunday(dateStr);
      for (let i = -2; i <= 2; i++) UI.renderWeekPage(Utils.addDays(sundayStr, i * 7));
      setTimeout(() => UI.scrollToWeek(sundayStr), 50);
      CalendarManager.modal.classList.add('hidden'); CalendarManager.modal.classList.remove('flex', 'modal-enter');
    },
    init: () => {
      document.getElementById('btn-open-calendar').addEventListener('click', () => {
        if(STATE.focusedWeekStart) STATE.calRenderMonth = new Date(STATE.focusedWeekStart);
        CalendarManager.render();
        CalendarManager.modal.classList.remove('hidden'); CalendarManager.modal.classList.add('flex', 'modal-enter');
      });
      document.getElementById('close-calendar').addEventListener('click', () => {
        CalendarManager.modal.classList.add('hidden'); CalendarManager.modal.classList.remove('flex', 'modal-enter');
      });
      document.getElementById('cal-prev').addEventListener('click', () => {
        STATE.calRenderMonth.setMonth(STATE.calRenderMonth.getMonth() - 1); CalendarManager.render();
      });
      document.getElementById('cal-next').addEventListener('click', () => {
        STATE.calRenderMonth.setMonth(STATE.calRenderMonth.getMonth() + 1); CalendarManager.render();
      });
    }
  };

  const StatsEngine = {
    modal: document.getElementById('modal-stats'),
    latestPromptData: null,
    
    switchTab: (tabId) => {
      for(let i=1; i<=3; i++) {
        const btn = document.getElementById(`tab-btn-${i}`);
        const content = document.getElementById(`tab-content-${i}`);
        if(i === tabId) {
          btn.className = "flex-1 py-2.5 text-[13px] tab-active";
          content.classList.remove('hidden'); content.classList.add('block');
        } else {
          btn.className = "flex-1 py-2.5 text-[13px] tab-inactive";
          content.classList.remove('block'); content.classList.add('hidden');
        }
      }
    },

    calculate: () => {
      const staffStats = {};
      CONFIG.STAFF_LIST.forEach(s => staffStats[s] = {
        sum: 0, count: 0, leaveCount: 0, hits: { good: 0, mid: 0, bad: 0 }
      });
      let baseSum = 0, baseCount = 0;

      const pastDates = [];
      for(let i=0; i<60; i++) pastDates.push(Utils.addDays(STATE.todayStr, -i));
      
      const promptJSON = {};
      let firstDate = null, lastDate = null;

      pastDates.forEach(dStr => {
        const d = new Date(dStr);
        if(d.getDay() === 6 || d.getDay() === 0) return; 
        
        const dayData = STATE.daysMap[dStr];
        if(!dayData || dayData.isFullDayHoliday) return;
        
        const shifts = Utils.normalizeShifts(dayData.shifts);
        if(shifts.length === 0) return;

        if(!lastDate) lastDate = dStr; 
        firstDate = dStr; 

        promptJSON[dStr] = shifts.map(s => s.staff);
        const activeCount = shifts.filter(s => s.status !== 'LEAVE').length;

        let activeIdx = 0;
        shifts.forEach((shift, visualSlot) => {
          if(!staffStats[shift.staff]) return;
          
          if (shift.status === 'LEAVE') {
            staffStats[shift.staff].leaveCount++;
            return;
          }
          
          const shiftScore = (6 - activeCount + 1) + activeIdx;
          staffStats[shift.staff].sum += shiftScore;
          staffStats[shift.staff].count += 1;
          
          baseSum += shiftScore;
          baseCount += 1;
          activeIdx++;

          // 命中率 (基於畫面視覺更位 0-5)
          if (visualSlot <= 1) staffStats[shift.staff].hits.good++;
          else if (visualSlot <= 3) staffStats[shift.staff].hits.mid++;
          else staffStats[shift.staff].hits.bad++;
        });
      });

      const globalAvg = baseCount > 0 ? (baseSum / baseCount) : 0;
      
      // Calculate PnL (盈虧 = 動態基準均位總和 - 該人實際得分總和)
      // 分數越細越好，所以用 (基準 - 實際) 嚟計，正數代表著數。
      Object.keys(staffStats).forEach(s => {
        const data = staffStats[s];
        data.avg = data.count > 0 ? (data.sum / data.count) : 0;
        data.pnl = data.count > 0 ? ((globalAvg * data.count) - data.sum) : 0;
      });

      StatsEngine.renderUI(globalAvg, staffStats);
      
      StatsEngine.latestPromptData = {
        dateRange: (firstDate && lastDate) ? `${firstDate} ~ ${lastDate}` : '無數據',
        globalAvg: globalAvg.toFixed(2),
        staffStats: staffStats,
        json: promptJSON
      };
    },

    renderUI: (globalAvg, stats) => {
      document.getElementById('stats-baseline').innerText = `動態基準均位: ${globalAvg.toFixed(2)}`;
      
      const grid1 = document.getElementById('stats-grid-1');
      const grid2 = document.getElementById('stats-grid-2');
      const grid3 = document.getElementById('stats-grid-3');
      grid1.innerHTML = ''; grid2.innerHTML = ''; grid3.innerHTML = '';

      CONFIG.STAFF_LIST.forEach(staff => {
        const data = stats[staff];
        
        // Tab 1: Baseline vs Avg
        const avgStr = data.count > 0 ? data.avg.toFixed(2) : '--';
        let color1 = 'text-gray-700';
        if (data.count > 0) {
          if (data.avg - globalAvg > 0.1) color1 = 'text-red-500 font-bold';
          else if (data.avg - globalAvg < -0.1) color1 = 'text-green-600 font-bold';
        }
        grid1.innerHTML += `
          <div class="bg-gray-50 rounded p-2 border border-gray-100 flex flex-col justify-center pl-3">
            <div class="flex items-end gap-2 mb-1">
              <span class="text-lg font-extrabold text-gray-800">${staff}</span>
              <span class="text-xl tracking-tight ${color1}">${avgStr}</span>
            </div>
            <div class="text-[10px] text-gray-500 font-bold">當值: ${data.count} | 🌴 ${data.leaveCount}日</div>
          </div>
        `;

        // Tab 2: PnL
        const pnlStr = data.count > 0 ? (data.pnl > 0 ? `+${data.pnl.toFixed(1)}` : data.pnl.toFixed(1)) : '--';
        const color2 = data.pnl > 0 ? 'text-green-600' : (data.pnl < 0 ? 'text-red-500' : 'text-gray-500');
        grid2.innerHTML += `
          <div class="bg-gray-50 rounded p-2 border border-gray-100 flex flex-col items-center justify-center">
            <span class="text-sm font-extrabold text-gray-800 mb-1">${staff}</span>
            <span class="text-[17px] font-bold ${color2}">${pnlStr}</span>
          </div>
        `;

        // Tab 3: Hit Rate
        const totalHits = data.hits.good + data.hits.mid + data.hits.bad;
        const pGood = totalHits > 0 ? Math.round((data.hits.good / totalHits) * 100) : 0;
        const pMid = totalHits > 0 ? Math.round((data.hits.mid / totalHits) * 100) : 0;
        const pBad = totalHits > 0 ? Math.round((data.hits.bad / totalHits) * 100) : 0;
        grid3.innerHTML += `
          <div class="flex items-center bg-gray-50 border border-gray-100 p-2 rounded gap-2">
            <div class="w-8 text-center font-extrabold text-gray-800 text-lg">${staff}</div>
            <div class="flex-1 flex text-[10px] font-bold text-white h-5 rounded overflow-hidden">
               <div style="width: ${pGood}%" class="bg-green-500 flex items-center justify-center">${pGood}%</div>
               <div style="width: ${pMid}%" class="bg-blue-400 flex items-center justify-center">${pMid}%</div>
               <div style="width: ${pBad}%" class="bg-red-400 flex items-center justify-center">${pBad}%</div>
            </div>
          </div>
        `;
      });
    },

    init: () => {
      document.getElementById('btn-stats').addEventListener('click', () => {
        StatsEngine.calculate();
        StatsEngine.modal.classList.remove('hidden'); StatsEngine.modal.classList.add('flex', 'modal-enter');
      });
      document.getElementById('close-stats').addEventListener('click', () => {
        StatsEngine.modal.classList.add('hidden'); StatsEngine.modal.classList.remove('flex', 'modal-enter');
      });
      
      const btnCopy = document.getElementById('btn-copy-prompt');
      btnCopy.addEventListener('click', () => {
        if(!StatsEngine.latestPromptData) return;
        const d = StatsEngine.latestPromptData;
        
        let stat1 = `動態基準均位: ${d.globalAvg}\n` + CONFIG.STAFF_LIST.map(s => `${s}: 均位 ${d.staffStats[s].count > 0 ? d.staffStats[s].avg.toFixed(2) : '0'} (休假 ${d.staffStats[s].leaveCount}日)`).join('\n');
        let stat2 = CONFIG.STAFF_LIST.map(s => `${s}: ${d.staffStats[s].count > 0 ? (d.staffStats[s].pnl > 0 ? '+' : '') + d.staffStats[s].pnl.toFixed(2) : '0'}`).join('\n');
        let stat3 = CONFIG.STAFF_LIST.map(s => {
          const h = d.staffStats[s].hits; const t = h.good + h.mid + h.bad;
          return `${s}: 靚 ${t>0?Math.round((h.good/t)*100):0}% | 平 ${t>0?Math.round((h.mid/t)*100):0}% | 差 ${t>0?Math.round((h.bad/t)*100):0}%`;
        }).join('\n');

        const finalPrompt = CONFIG.DEFAULT_PROMPT
          .replace('{{DATE_RANGE}}', d.dateRange)
          .replace('{{STATISTICS}}', stat1)
          .replace('{{STATS_PNL}}', stat2)
          .replace('{{STATS_HITRATE}}', stat3)
          .replace('{{SCHEDULE_DATA}}', JSON.stringify(d.json, null, 2));

        navigator.clipboard.writeText(finalPrompt).then(() => {
          const origHTML = btnCopy.innerHTML;
          btnCopy.innerHTML = '✅ 已成功複製';
          btnCopy.className = btnCopy.className.replace('from-blue-600 to-indigo-600', 'from-green-500 to-emerald-600');
          setTimeout(() => {
            btnCopy.innerHTML = origHTML;
            btnCopy.className = btnCopy.className.replace('from-green-500 to-emerald-600', 'from-blue-600 to-indigo-600');
          }, 2000);
        });
      });
    }
  };

  const FirebaseSync = {
    init: () => {
      if (!STATE.apiKey) {
        document.getElementById('conn-status').innerText = '🔴 離線模式'; 
        document.getElementById('conn-status').className = 'bg-red-50 text-red-600 px-1.5 py-0.5 rounded border border-red-200 text-[10px] font-bold';
        return;
      }
      try {
        const app = initializeApp({ ...CONFIG.firebaseBase, apiKey: STATE.apiKey });
        STATE.db = getDatabase(app, CONFIG.firebaseBase.databaseURL);
        document.getElementById('conn-status').innerText = '🟢 已連線'; 
        document.getElementById('conn-status').className = 'bg-green-50 text-green-600 px-1.5 py-0.5 rounded border border-green-200 text-[10px] font-bold';
        
        onValue(ref(STATE.db, CONFIG.dbPath), (snapshot) => {
          let data = snapshot.val();
          if (!data) return;
          if (data.daysMap) {
            const batchUpdates = {};
            Object.keys(data.daysMap).forEach(dateKey => { if (!data[dateKey]) batchUpdates[`${CONFIG.dbPath}/${dateKey}`] = data.daysMap[dateKey]; });
            batchUpdates[`${CONFIG.dbPath}/daysMap`] = null; 
            update(ref(STATE.db), batchUpdates); return; 
          }
          let hasChanges = false;
          Object.keys(data).forEach(dStr => {
            if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(dStr) && dStr.length !== 10) return; 
            let dayData = data[dStr];
            if (dayData && dayData.shifts) dayData.shifts = Utils.normalizeShifts(dayData.shifts);
            if (JSON.stringify(STATE.daysMap[dStr]) !== JSON.stringify(dayData)) {
              STATE.daysMap[dStr] = dayData;
              hasChanges = true;
            }
          });
          if(hasChanges) Engine.evaluateLockState();
        });
      } catch (err) { console.error(err); }
    },
    pushUpdate: (dateStr) => {
      if (!STATE.db) return;
      const updates = {}; updates[`${CONFIG.dbPath}/${dateStr}`] = STATE.daysMap[dateStr];
      update(ref(STATE.db), updates).catch(console.error);
    }
  };

  const SettingsManager = {
    modal: document.getElementById('modal-settings'),
    init: () => {
      document.getElementById('btn-settings').addEventListener('click', () => {
        document.getElementById('input-api-key').value = STATE.apiKey;
        SettingsManager.modal.classList.remove('hidden'); SettingsManager.modal.classList.add('flex', 'modal-enter');
      });
      document.getElementById('close-settings').addEventListener('click', () => {
        SettingsManager.modal.classList.add('hidden'); SettingsManager.modal.classList.remove('flex', 'modal-enter');
      });
      document.getElementById('btn-save-settings').addEventListener('click', () => {
        localStorage.setItem('roster_api_key', document.getElementById('input-api-key').value.trim());
        window.location.reload(); 
      });
    }
  };

  const initApp = () => {
    const keysContainer = document.getElementById('staff-keys');
    CONFIG.STAFF_LIST.forEach(staff => {
      const btn = document.createElement('button');
      btn.className = 'bg-blue-50 border border-blue-200 text-blue-700 text-2xl font-extrabold py-3 rounded-xl shadow-sm active:bg-blue-200 transition-colors flex items-center justify-center';
      btn.textContent = staff; keysContainer.appendChild(btn);
    });

    const currentSunday = Utils.getSunday(STATE.todayStr);
    for (let i = -2; i <= 2; i++) UI.renderWeekPage(Utils.addDays(currentSunday, i * 7));

    FirebaseSync.init();
    SettingsManager.init();
    StatsEngine.init();
    CalendarManager.init();

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { 
        if (entry.isIntersecting) {
          STATE.focusedWeekStart = entry.target.dataset.weekStart;
          const d1 = new Date(STATE.focusedWeekStart), d2 = new Date(Utils.addDays(STATE.focusedWeekStart, 6));
          UI.headerDate.innerText = `${d1.getMonth()+1}/${d1.getDate()}(日) - ${d2.getMonth()+1}/${d2.getDate()}(六)`;
          Engine.evaluateLockState();
        } 
      });
    }, { threshold: 0.6 });
    
    document.querySelectorAll('.week-page').forEach(page => observer.observe(page));
    
    // 瞬間對位
    UI.scrollToWeek(currentSunday);

    // 綁定操作
    document.getElementById('staff-keys').addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') Engine.addShift(e.target.textContent); });
    document.getElementById('btn-backspace').addEventListener('click', Engine.backspace);
    document.getElementById('btn-alloff').addEventListener('click', Engine.setAllOff);
    document.getElementById('lock-overlay').addEventListener('click', Engine.handleOverlayClick);
    
    document.getElementById('prev-week').addEventListener('click', () => {
      UI.container.classList.remove('instant-scroll');
      UI.scrollToWeek(Utils.addDays(STATE.focusedWeekStart, -7));
    });
    document.getElementById('next-week').addEventListener('click', () => {
      UI.container.classList.remove('instant-scroll');
      UI.scrollToWeek(Utils.addDays(STATE.focusedWeekStart, 7));
    });
  };

  initApp();
</script>
</body>
</html>
